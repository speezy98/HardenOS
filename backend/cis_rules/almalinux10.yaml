- control_id: '2.3.1.lm'
  check_type: comparison
  title: Ensure chrony is not run as the root user
  domain: crypto
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Exécuter chrony sous un compte non privilégié limite l'impact d'une compromission du démon de synchronisation de temps, garant de la validité des certificats et journaux.
  audit:
    # Extrait l'utilisateur configuré (dernière directive `user`) : conforme SEULEMENT
    # s'il est défini ET différent de root. Aucun user configuré -> "chrony root ou
    # absent" (pas de faux pass).
    command: 'u=$(grep -hoP ''^\h*user\h+\K\S+'' /etc/chrony.conf /etc/sysconfig/chronyd 2>/dev/null | tail -1); [ -n "$u" ] && [ "$u" != "root" ] && echo ''chrony non-root'' || echo ''chrony root ou absent'''
    expected: chrony non-root
    condition: chrony ne doit pas s'exécuter en root
  remediation:
    type: bash
    script: '# S''assurer que chronyd s''exécute sous l''utilisateur chrony'
  threat:
    attack_technique: T1068
    attack_name: Exploitation for Privilege Escalation
    cve: null
    cvss: null
    description: Limite l'impact d'une compromission du démon de temps en réduisant ses privilèges.
