# CIS AlmaLinux OS 10 — 100 contrôles sélectionnés pour HardenOS.
# Généré depuis SELECTION_CIS_AlmaLinux10.md. Ne pas éditer à la main.
benchmark:
  os_type: linux
  os_family: rhel
  os_version: AlmaLinux 10
  source: CIS AlmaLinux OS 10 Benchmark v1.0.0
  package_manager: dnf
controls:
- control_id: '5.1.20'
  check_type: comparison
  title: Ensure sshd PermitRootLogin is disabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 5
  impact: critical
  description: Interdire la connexion SSH directe en root force l'usage de comptes nominatifs puis l'élévation de privilèges, garantissant la traçabilité.
  audit:
    command: sshd -T | grep permitrootlogin
    expected: permitrootlogin no
    condition: Doit valoir no
  remediation:
    type: bash
    script: echo 'PermitRootLogin no' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1021.004
    attack_name: 'Remote Services: SSH'
    cve: null
    cvss: null
    description: Empêche l'accès distant direct au compte le plus privilégié via SSH.
- control_id: '5.1.19'
  check_type: comparison
  title: Ensure sshd PermitEmptyPasswords is disabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 5
  impact: critical
  description: Autoriser les mots de passe vides en SSH permettrait de se connecter à un compte sans aucun secret.
  audit:
    command: sshd -T | grep permitemptypasswords
    expected: permitemptypasswords no
    condition: Doit valoir no
  remediation:
    type: bash
    script: echo 'PermitEmptyPasswords no' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Bloque l'accès à des comptes dépourvus de mot de passe.
- control_id: '5.4.2.1'
  check_type: comparison
  title: Ensure root is the only UID 0 account
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 5
  impact: critical
  description: Seul le compte root doit avoir l'UID 0. Tout autre compte UID 0 disposerait des pleins pouvoirs système.
  audit:
    command: 'awk -F: ''($3 == 0) { print $1 }'' /etc/passwd'
    expected: root
    condition: La sortie ne doit contenir que root
  remediation:
    type: bash
    script: '# Supprimer ou corriger tout compte non-root ayant l''UID 0'
  threat:
    attack_technique: T1078.003
    attack_name: 'Valid Accounts: Local Accounts'
    cve: null
    cvss: null
    description: Détecte les comptes portes dérobées à privilèges root.
- control_id: '5.2.1'
  check_type: presence
  title: Ensure sudo is installed
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: sudo permet une élévation de privilèges contrôlée et traçable. Maintenir une version à jour évite des failles d'élévation locale connues.
  audit:
    command: rpm -q sudo
    expected: null
    condition: Le paquet sudo doit être installé
  remediation:
    type: bash
    script: dnf install sudo
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: CVE-2021-3156
    cvss: 7.8
    description: sudo est installé par défaut sur la famille RHEL et a été affecté par Baron Samedit (CVE-2021-3156, CVSS 7.8), débordement de tampon permettant à tout utilisateur local de devenir root.
- control_id: '5.2.4'
  check_type: absence
  title: Ensure users must provide password for escalation
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Exiger un mot de passe pour sudo empêche une élévation silencieuse si un compte standard est compromis.
  audit:
    command: grep -rP -- '^\h*[^#].*NOPASSWD' /etc/sudoers /etc/sudoers.d/
    expected: null
    condition: Aucune entrée NOPASSWD ne doit être présente
  remediation:
    type: bash
    script: '# Retirer toutes les occurrences de NOPASSWD dans /etc/sudoers et /etc/sudoers.d/'
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: null
    cvss: null
    description: Empêche l'élévation de privilèges sans réauthentification après compromission d'un compte.
- control_id: '1.3.1.1'
  check_type: presence
  title: Ensure SELinux is installed
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: SELinux fournit un contrôle d'accès obligatoire (MAC) qui confine les processus au-delà des permissions Unix, prérequis d'un durcissement RHEL.
  audit:
    command: rpm -q libselinux
    expected: null
    condition: Le paquet libselinux doit être installé
  remediation:
    type: bash
    script: dnf install libselinux
  threat:
    attack_technique: T1068
    attack_name: Exploitation for Privilege Escalation
    cve: null
    cvss: null
    description: Prérequis au confinement obligatoire des processus limitant l'impact d'un exploit.
- control_id: '5.3.2.1.1'
  check_type: presence
  title: Ensure password failed attempts lockout is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Définir un seuil de tentatives échouées avant verrouillage protège contre les attaques par force brute.
  audit:
    command: grep -P '^\h*deny\h*=' /etc/security/faillock.conf
    expected: null
    condition: deny doit être inférieur ou égal à 5
  remediation:
    type: bash
    script: echo 'deny = 5' >> /etc/security/faillock.conf
  threat:
    attack_technique: T1110.001
    attack_name: 'Brute Force: Password Guessing'
    cve: null
    cvss: null
    description: Le verrouillage après échecs répétés neutralise la devinette de mot de passe.
- control_id: '5.3.1.2'
  check_type: presence
  title: Ensure pam_faillock module is enabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: pam_faillock verrouille un compte après plusieurs échecs d'authentification, contrant la force brute au niveau PAM (géré via authselect).
  audit:
    command: grep -P 'pam_faillock\.so' /etc/pam.d/system-auth /etc/pam.d/password-auth
    expected: null
    condition: Le module pam_faillock doit être activé
  remediation:
    type: bash
    script: authselect enable-feature with-faillock; authselect apply-changes
  threat:
    attack_technique: T1110
    attack_name: Brute Force
    cve: null
    cvss: null
    description: Applique le verrouillage de compte contre la force brute via PAM.
- control_id: '5.3.2.2.2'
  check_type: presence
  title: Ensure password length is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Imposer une longueur minimale de 14 caractères augmente fortement la résistance aux attaques par force brute.
  audit:
    command: grep -P '^\h*minlen\h*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    expected: null
    condition: minlen doit être supérieur ou égal à 14
  remediation:
    type: bash
    script: echo 'minlen = 14' >> /etc/security/pwquality.conf
  threat:
    attack_technique: T1110.002
    attack_name: 'Brute Force: Password Cracking'
    cve: null
    cvss: null
    description: Des mots de passe longs résistent au cassage hors ligne.
- control_id: '5.1.16'
  check_type: comparison
  title: Ensure sshd MaxAuthTries is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Limiter le nombre de tentatives d'authentification par connexion freine les attaques par force brute via SSH.
  audit:
    command: sshd -T | grep maxauthtries
    expected: maxauthtries 4
    condition: La valeur doit être inférieure ou égale à 4
  remediation:
    type: bash
    script: echo 'MaxAuthTries 4' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1110.001
    attack_name: 'Brute Force: Password Guessing'
    cve: null
    cvss: null
    description: Réduit le nombre d'essais d'authentification par session SSH.
- control_id: '5.4.1.4'
  check_type: presence
  title: Ensure strong password hashing algorithm is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Configurer ENCRYPT_METHOD sur un algorithme fort (sha512 ou yescrypt) assure un stockage robuste des nouveaux mots de passe.
  audit:
    command: grep -Pi '^\h*ENCRYPT_METHOD\h+(SHA512|YESCRYPT)\b' /etc/login.defs
    expected: null
    condition: ENCRYPT_METHOD doit être SHA512 ou YESCRYPT
  remediation:
    type: bash
    script: sed -i 's/^ENCRYPT_METHOD.*/ENCRYPT_METHOD SHA512/' /etc/login.defs
  threat:
    attack_technique: T1003.008
    attack_name: 'OS Credential Dumping: /etc/passwd and /etc/shadow'
    cve: null
    cvss: null
    description: Un hachage fort rend inexploitable le vol du fichier shadow.
- control_id: '5.1.1'
  check_type: comparison
  title: Ensure permissions on /etc/ssh/sshd_config are configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Le fichier sshd_config contrôle la configuration du serveur SSH et doit être protégé, accessible uniquement à root.
  audit:
    command: stat -Lc '%a %u %g' /etc/ssh/sshd_config
    expected: 600 0 0
    condition: Permissions 600 ou plus restrictif, propriétaire et groupe root
  remediation:
    type: bash
    script: chmod u-x,go-rwx /etc/ssh/sshd_config; chown root:root /etc/ssh/sshd_config
  threat:
    attack_technique: T1098.004
    attack_name: 'Account Manipulation: SSH Authorized Keys'
    cve: null
    cvss: null
    description: Empêche la modification non autorisée de la configuration SSH.
- control_id: '5.1.2'
  # presence-as-configured : vérifie l'existence du réglage (perms des clés SSH) ;
  # la validation fine de la valeur/permissions relève d'une passe ultérieure.
  check_type: presence
  title: Ensure permissions on SSH private host key files are configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Les clés privées d'hôte SSH authentifient le serveur ; leur lecture permettrait d'usurper son identité.
  audit:
    command: find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec stat -Lc '%n %a %U %G' {} +
    expected: null
    condition: Chaque clé privée en 600 ou plus restrictif, propriétaire root
  remediation:
    type: bash
    script: find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec chmod 600 {} +; find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec chown root:root {} +
  threat:
    attack_technique: T1563.001
    attack_name: 'Remote Service Session Hijacking: SSH Hijacking'
    cve: null
    cvss: null
    description: Protège les clés d'hôte dont le vol permettrait des attaques de l'homme du milieu.
- control_id: '5.1.21'
  check_type: comparison
  title: Ensure sshd PermitUserEnvironment is disabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Permettre aux utilisateurs de définir des variables d'environnement via SSH peut servir à contourner des restrictions.
  audit:
    command: sshd -T | grep permituserenvironment
    expected: permituserenvironment no
    condition: Doit valoir no
  remediation:
    type: bash
    script: echo 'PermitUserEnvironment no' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1574.006
    attack_name: 'Hijack Execution Flow: Dynamic Linker Hijacking'
    cve: null
    cvss: null
    description: Empêche l'injection de variables d'environnement détournant l'exécution.
- control_id: '5.1.10'
  check_type: comparison
  title: Ensure sshd HostbasedAuthentication is disabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: L'authentification basée sur l'hôte fait confiance à des machines entières, ce qui est risqué.
  audit:
    command: sshd -T | grep hostbasedauthentication
    expected: hostbasedauthentication no
    condition: Doit valoir no
  remediation:
    type: bash
    script: echo 'HostbasedAuthentication no' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Empêche l'abus de relations de confiance entre hôtes.
- control_id: '5.1.11'
  check_type: comparison
  title: Ensure sshd IgnoreRhosts is enabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: IgnoreRhosts désactive les anciens fichiers .rhosts permettant une authentification non sécurisée.
  audit:
    command: sshd -T | grep ignorerhosts
    expected: ignorerhosts yes
    condition: Doit valoir yes
  remediation:
    type: bash
    script: echo 'IgnoreRhosts yes' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Neutralise un mécanisme d'authentification hérité non sécurisé.
- control_id: '5.2.7'
  check_type: presence
  title: Ensure access to the su command is restricted
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Restreindre la commande su à un groupe précis via pam_wheel limite quels comptes peuvent devenir root.
  audit:
    command: grep -Pi '^\h*auth\h+(required|requisite)\h+pam_wheel\.so' /etc/pam.d/su
    expected: null
    condition: pam_wheel.so avec use_uid et un groupe défini doit être configuré
  remediation:
    type: bash
    script: echo 'auth required pam_wheel.so use_uid group=wheel' >> /etc/pam.d/su
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: null
    cvss: null
    description: Limite quels utilisateurs peuvent basculer vers root.
- control_id: '5.3.1.5'
  check_type: presence
  title: Ensure pam_unix module is enabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Le module pam_unix gère l'authentification par mot de passe traditionnelle et doit être actif dans le profil authselect.
  audit:
    command: grep -P 'pam_unix\.so' /etc/pam.d/system-auth /etc/pam.d/password-auth
    expected: null
    condition: pam_unix doit être activé dans la configuration PAM
  remediation:
    type: bash
    script: authselect apply-changes
  threat:
    attack_technique: T1556
    attack_name: Modify Authentication Process
    cve: null
    cvss: null
    description: Garantit l'intégrité du processus d'authentification par mot de passe.
- control_id: '5.4.1.1'
  check_type: presence
  title: Ensure password expiration is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Forcer l'expiration périodique des mots de passe limite la durée d'exploitation d'un secret compromis.
  audit:
    command: grep -P '^\h*PASS_MAX_DAYS' /etc/login.defs
    expected: null
    condition: PASS_MAX_DAYS doit être inférieur ou égal à 365
  remediation:
    type: bash
    script: sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS 365/' /etc/login.defs
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Réduit la fenêtre d'usage d'identifiants valides dérobés.
- control_id: '5.1.7'
  # presence-as-configured : vérifie l'existence du réglage (plage ClientAliveInterval 1-15 / CountMax <= 3) ;
  # la validation fine de la valeur/permissions relève d'une passe ultérieure.
  check_type: presence
  title: Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Ces paramètres ferment les sessions SSH inactives, réduisant le risque de détournement de session.
  audit:
    command: sshd -T | grep -E 'clientaliveinterval|clientalivecountmax'
    expected: null
    condition: ClientAliveInterval entre 1 et 15, ClientAliveCountMax inférieur ou égal à 3
  remediation:
    type: bash
    script: printf 'ClientAliveInterval 15\nClientAliveCountMax 3\n' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1563.001
    attack_name: 'Remote Service Session Hijacking: SSH Hijacking'
    cve: null
    cvss: null
    description: Limite l'exposition des sessions SSH inactives au détournement.
- control_id: '5.2.2'
  check_type: presence
  title: Ensure sudo commands use pty
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Forcer l'usage d'un pseudo-terminal pour sudo empêche certaines attaques par détournement de processus.
  audit:
    command: grep -rPi -- '^\h*Defaults\h+([^#\n\r]+,)?use_pty\b' /etc/sudoers /etc/sudoers.d/
    expected: null
    condition: La directive Defaults use_pty doit être présente
  remediation:
    type: bash
    script: echo 'Defaults use_pty' >> /etc/sudoers.d/use_pty
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: null
    cvss: null
    description: Empêche le détournement de processus enfant lors d'une exécution sudo.
- control_id: '5.2.3'
  check_type: presence
  title: Ensure sudo log file exists
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Journaliser les commandes sudo dans un fichier dédié assure la traçabilité des élévations de privilèges.
  audit:
    command: grep -rPsi -- '^\h*Defaults\h+([^#]+,\h*)?logfile\h*=' /etc/sudoers /etc/sudoers.d/
    expected: null
    condition: Une directive Defaults logfile doit être définie
  remediation:
    type: bash
    script: echo 'Defaults logfile="/var/log/sudo.log"' >> /etc/sudoers.d/logfile
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: null
    cvss: null
    description: Trace les élévations de privilèges pour détecter les abus de sudo.
- control_id: '1.4.1'
  check_type: presence
  title: Ensure bootloader password is set
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Protéger GRUB par mot de passe empêche la modification des paramètres de boot par un accès physique.
  audit:
    command: grep -P '^\h*GRUB2_PASSWORD' /boot/grub2/user.cfg
    expected: null
    condition: Un mot de passe GRUB2 doit être défini
  remediation:
    type: bash
    script: grub2-setpassword; grub2-mkconfig -o /boot/grub2/grub.cfg
  threat:
    attack_technique: T1542
    attack_name: Pre-OS Boot
    cve: null
    cvss: null
    description: Empêche le contournement de l'authentification via modification du démarrage.
- control_id: '5.4.3.3'
  check_type: presence
  title: Ensure default user shell timeout is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Définir un délai d'inactivité du shell déconnecte les sessions oubliées, réduisant le risque d'exploitation.
  audit:
    command: grep -rPs '^\h*TMOUT' /etc/profile /etc/profile.d/*.sh /etc/bashrc
    expected: null
    condition: TMOUT doit être inférieur ou égal à 900 secondes
  remediation:
    type: bash
    script: echo 'readonly TMOUT=900 ; export TMOUT' >> /etc/profile.d/tmout.sh
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Ferme les sessions inactives, limitant le détournement de session.
- control_id: '4.1.3'
  check_type: presence
  title: Ensure firewalld.service is enabled and running
  domain: network
  cis_level: L1
  profile: server
  automated: true
  weight: 5
  impact: critical
  description: Le service de pare-feu doit être actif et activé au démarrage pour filtrer le trafic réseau en continu.
  audit:
    command: systemctl is-enabled firewalld.service; systemctl is-active firewalld.service
    expected: null
    condition: firewalld doit être enabled et active
  remediation:
    type: bash
    script: systemctl --now enable firewalld.service
  threat:
    attack_technique: T1190
    attack_name: Exploit Public-Facing Application
    cve: null
    cvss: null
    description: Un pare-feu actif limite l'exposition des services aux attaques réseau entrantes.
- control_id: '4.1.1'
  check_type: presence
  title: Ensure firewalld is installed
  domain: network
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: firewalld gère le filtrage réseau via nftables et constitue la première ligne de défense réseau de l'hôte.
  audit:
    command: rpm -q firewalld
    expected: null
    condition: Le paquet firewalld doit être installé
  remediation:
    type: bash
    script: dnf install firewalld
  threat:
    attack_technique: T1190
    attack_name: Exploit Public-Facing Application
    cve: null
    cvss: null
    description: Prérequis au filtrage du trafic entrant malveillant.
- control_id: '4.1.4'
  check_type: presence
  title: Ensure firewalld active zone target is configured
  domain: network
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: La cible de la zone active de firewalld doit appliquer une politique de refus par défaut sur le trafic non autorisé.
  audit:
    command: firewall-cmd --get-active-zones
    expected: null
    condition: La zone active doit avoir une cible appropriée (par ex. DROP) selon la politique
  remediation:
    type: bash
    script: firewall-cmd --permanent --zone=public --set-target=DROP; firewall-cmd --reload
  threat:
    attack_technique: T1190
    attack_name: Exploit Public-Facing Application
    cve: null
    cvss: null
    description: Applique le refus par défaut du trafic non explicitement autorisé.
- control_id: '3.3.1.1'
  check_type: comparison
  title: Ensure net.ipv4.ip_forward is configured
  domain: network
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Désactiver le routage IP sur une machine qui n'est pas un routeur empêche le transit de trafic non désiré.
  audit:
    command: sysctl net.ipv4.ip_forward
    expected: net.ipv4.ip_forward = 0
    condition: Doit valoir 0 sauf si la machine est un routeur
  remediation:
    type: bash
