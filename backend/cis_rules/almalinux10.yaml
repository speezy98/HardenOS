- control_id: '2.3.x.lm'
  check_type: comparison
  title: Ensure system wide crypto policy is not legacy
  domain: crypto
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: La politique cryptographique système ne doit pas être en mode LEGACY, qui autorise des algorithmes obsolètes et faibles.
  audit:
    # Émet une valeur canonique : compare la politique de base (avant ':') à LEGACY.
    # cut -d: -f1 isole la base (ex. 'LEGACY:AD-SUPPORT' -> 'LEGACY') pour un test exact.
    command: 'test "$(update-crypto-policies --show 2>/dev/null | cut -d: -f1)" != "LEGACY" && echo ''crypto conforme'' || echo ''crypto non conforme = LEGACY'''
    expected: crypto conforme
    condition: La politique ne doit pas être LEGACY (DEFAULT, FUTURE ou FIPS attendus)
  remediation:
    type: bash
    script: update-crypto-policies --set DEFAULT
  threat:
    attack_technique: T1040
    attack_name: Network Sniffing
    cve: null
    cvss: null
    description: Empêche l'usage d'algorithmes cryptographiques faibles exposant les communications.
