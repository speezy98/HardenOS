# CIS Microsoft Windows Server 2022 — 100 contrôles sélectionnés pour HardenOS.
# Généré depuis SELECTION_CIS_WindowsServer2022.md. Ne pas éditer à la main.
benchmark:
  os_type: windows
  os_family: windows
  os_version: Windows Server 2022
  source: CIS Microsoft Windows Server 2022 Benchmark v5.0.0
  package_manager: none
controls:
- control_id: '2.2.9'
  title: Ensure 'Act as part of the operating system' is set to 'No One'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 5
  impact: critical
  description: Ce privilège extrêmement puissant permet d'usurper n'importe quel utilisateur et ne doit être attribué à personne.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'SeTcbPrivilege').Line
    expected: null
    condition: SeTcbPrivilege ne doit être attribué à personne
  remediation:
    type: powershell
    script: '# Retirer tous les comptes de : Act as part of the operating system'
  threat:
    attack_technique: T1134
    attack_name: Access Token Manipulation
    cve: null
    cvss: null
    description: Empêche l'usurpation d'identité au niveau du système via un privilège de confiance maximal.
- control_id: '2.2.2'
  title: Ensure 'Deny access to this computer from the network' includes 'Guests'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 5
  impact: critical
  description: Refuser l'accès réseau aux invités et comptes anonymes empêche tout accès distant non authentifié.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'SeDenyNetworkLogonRight').Line
    expected: null
    condition: Le droit de refus d'accès réseau doit inclure Guests
  remediation:
    type: powershell
    script: '# Ajouter Guests à : Deny access to this computer from the network'
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Bloque l'accès réseau des comptes invité, vecteur d'accès non authentifié.
- control_id: '2.2.8'
  title: Ensure 'Take ownership of files or other objects' is set to 'Administrators'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 5
  impact: critical
  description: Le privilège de prise de possession permet de s'approprier n'importe quel objet ; il doit être réservé aux administrateurs.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'SeTakeOwnershipPrivilege').Line
    expected: null
    condition: SeTakeOwnershipPrivilege doit être limité à Administrators
  remediation:
    type: powershell
    script: '# Configurer User Rights Assignment : Take ownership = Administrators'
  threat:
    attack_technique: T1222.001
    attack_name: 'File and Directory Permissions Modification: Windows File and Directory Permissions Modification'
    cve: null
    cvss: null
    description: Empêche l'appropriation d'objets arbitraires pour contourner les permissions.
- control_id: '1.2.2'
  title: Ensure 'Account lockout threshold' is set to '5 or fewer invalid logon attempt(s), but not 0'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 5
  impact: critical
  description: Verrouiller un compte après un nombre limité d'échecs de connexion bloque efficacement les attaques par devinette de mot de passe.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'LockoutBadCount').Line
    expected: null
    condition: LockoutBadCount doit être entre 1 et 5
  remediation:
    type: powershell
    script: net accounts /lockoutthreshold:5
  threat:
    attack_technique: T1110.001
    attack_name: 'Brute Force: Password Guessing'
    cve: null
    cvss: null
    description: Le verrouillage après échecs neutralise les attaques par force brute sur les comptes.
- control_id: '2.3.1.1'
  title: 'Ensure ''Accounts: Guest account status'' is set to ''Disabled'''
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 4
  impact: high
  description: Le compte invité permet un accès anonyme et doit être désactivé pour empêcher tout accès non authentifié.
  audit:
    command: (Get-LocalUser -Name 'Guest').Enabled
    expected: 'False'
    condition: Le compte Guest doit être désactivé
  remediation:
    type: powershell
    script: Disable-LocalUser -Name 'Guest'
  threat:
    attack_technique: T1078.001
    attack_name: 'Valid Accounts: Default Accounts'
    cve: null
    cvss: null
    description: Désactive un compte par défaut servant d'accès anonyme.
- control_id: '2.2.10'
  title: Ensure 'Debug programs' is set to 'Administrators'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 4
  impact: high
  description: Le privilège de débogage donne accès à la mémoire des processus, dont les secrets ; il doit être limité aux administrateurs.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'SeDebugPrivilege').Line
    expected: null
    condition: SeDebugPrivilege doit être limité à Administrators
  remediation:
    type: powershell
    script: '# Configurer User Rights Assignment : Debug programs = Administrators'
  threat:
    attack_technique: T1003.001
    attack_name: 'OS Credential Dumping: LSASS Memory'
    cve: null
    cvss: null
    description: Restreint l'accès à la mémoire des processus, prévenant le vol d'identifiants dans LSASS.
- control_id: '2.2.7'
  title: Ensure 'Back up files and directories' is set to 'Administrators'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 4
  impact: high
  description: Le privilège de sauvegarde permet de contourner les permissions de fichiers ; il doit être strictement limité aux administrateurs.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'SeBackupPrivilege').Line
    expected: null
    condition: SeBackupPrivilege doit être limité à Administrators
  remediation:
    type: powershell
    script: '# Configurer User Rights Assignment : Back up files and directories = Administrators'
  threat:
    attack_technique: T1003.002
    attack_name: 'OS Credential Dumping: Security Account Manager'
    cve: null
    cvss: null
    description: Empêche le contournement des permissions pour copier des fichiers sensibles (SAM).
- control_id: '2.3.17.1'
  title: 'Ensure ''User Account Control: Run all administrators in Admin Approval Mode'' is set to ''Enabled'''
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 4
  impact: high
  description: L'UAC en mode approbation administrateur force la validation explicite des actions privilégiées, limitant l'élévation silencieuse.
  audit:
    command: (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableLUA
    expected: 1
    condition: EnableLUA doit valoir 1
  remediation:
    type: powershell
    script: Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA -Value 1
  threat:
    attack_technique: T1548.002
    attack_name: 'Abuse Elevation Control Mechanism: Bypass User Account Control'
    cve: null
    cvss: null
    description: Force la validation des élévations de privilèges, contrant le contournement de l'UAC.
- control_id: '1.1.4'
  title: Ensure 'Minimum password length' is set to '14 or more character(s)'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 4
  impact: high
  description: Imposer une longueur minimale de 14 caractères augmente fortement la résistance aux attaques par force brute.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'MinimumPasswordLength').Line
    expected: null
    condition: MinimumPasswordLength doit être supérieur ou égal à 14
  remediation:
    type: powershell
    script: net accounts /minpwlen:14
  threat:
    attack_technique: T1110.002
    attack_name: 'Brute Force: Password Cracking'
    cve: null
    cvss: null
    description: Des mots de passe longs résistent au cassage hors ligne des empreintes.
- control_id: '1.1.5'
  title: Ensure 'Password must meet complexity requirements' is set to 'Enabled'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 4
  impact: high
  description: Activer les exigences de complexité force l'usage de plusieurs types de caractères, renforçant la robustesse des mots de passe.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'PasswordComplexity').Line
    expected: PasswordComplexity = 1
    condition: PasswordComplexity doit valoir 1
  remediation:
    type: powershell
    script: '# Activer via Default Domain Policy : Password must meet complexity requirements = Enabled'
  threat:
    attack_technique: T1110.002
    attack_name: 'Brute Force: Password Cracking'
    cve: null
    cvss: null
    description: Augmente l'entropie des mots de passe contre le cassage et la devinette.
- control_id: '1.2.1'
  title: Ensure 'Account lockout duration' is set to '15 or more minute(s)'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 4
  impact: high
  description: Une durée de verrouillage suffisante après plusieurs échecs ralentit fortement les attaques par force brute.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'LockoutDuration').Line
    expected: null
    condition: LockoutDuration doit être supérieur ou égal à 15
  remediation:
    type: powershell
    script: net accounts /lockoutduration:15
  threat:
    attack_technique: T1110.001
    attack_name: 'Brute Force: Password Guessing'
    cve: null
    cvss: null
    description: Prolonge le blocage après échecs, ralentissant la force brute.
- control_id: '2.2.4'
  title: Ensure 'Deny log on locally' includes 'Guests'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 4
  impact: high
  description: Refuser l'ouverture de session locale aux invités empêche un accès console non authentifié.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'SeDenyInteractiveLogonRight').Line
    expected: null
    condition: Le droit de refus d'ouverture locale doit inclure Guests
  remediation:
    type: powershell
    script: '# Ajouter Guests à : Deny log on locally'
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Bloque l'ouverture de session console des comptes invité.
- control_id: '2.2.5'
  title: Ensure 'Deny log on through Remote Desktop Services' includes 'Guests'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 4
  impact: high
  description: Refuser l'accès Bureau à distance aux invités empêche une connexion RDP non autorisée.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'SeDenyRemoteInteractiveLogonRight').Line
    expected: null
    condition: Le droit doit inclure Guests (et Local account selon la politique)
  remediation:
    type: powershell
    script: '# Ajouter Guests à : Deny log on through Remote Desktop Services'
  threat:
    attack_technique: T1021.001
    attack_name: 'Remote Services: Remote Desktop Protocol'
    cve: null
    cvss: null
    description: Bloque l'accès RDP des comptes invité, vecteur de mouvement latéral.
- control_id: '2.3.10.1'
  title: 'Ensure ''Network access: Do not allow anonymous enumeration of SAM accounts'' is set to ''Enabled'''
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Empêcher l'énumération anonyme des comptes SAM évite qu'un attaquant non authentifié liste les comptes locaux.
  audit:
    command: (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa').RestrictAnonymousSAM
    expected: 1
    condition: RestrictAnonymousSAM doit valoir 1
  remediation:
    type: powershell
    script: Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RestrictAnonymousSAM -Value 1
  threat:
    attack_technique: T1087.001
    attack_name: 'Account Discovery: Local Account'
    cve: null
    cvss: null
    description: Empêche l'énumération anonyme des comptes locaux pour la reconnaissance.
- control_id: '1.1.1'
  title: Ensure 'Enforce password history' is set to '24 or more password(s)'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Conserver un historique d'au moins 24 mots de passe empêche les utilisateurs de réutiliser rapidement d'anciens mots de passe.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'PasswordHistorySize').Line
    expected: null
    condition: PasswordHistorySize doit être supérieur ou égal à 24
  remediation:
    type: powershell
    script: net accounts /uniquepw:24
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Empêche la réutilisation d'anciens mots de passe potentiellement compromis.
- control_id: '1.1.2'
  title: Ensure 'Maximum password age' is set to '365 or fewer days, but not 0'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Forcer le changement périodique du mot de passe limite la durée d'exploitation d'un secret compromis.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'MaximumPasswordAge').Line
    expected: null
    condition: MaximumPasswordAge doit être entre 1 et 365
  remediation:
    type: powershell
    script: net accounts /maxpwage:365
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Réduit la fenêtre d'exploitation d'un mot de passe compromis.
- control_id: '1.2.3'
  title: Ensure 'Reset account lockout counter after' is set to '15 or more minute(s)'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Définir un délai avant réinitialisation du compteur d'échecs renforce l'efficacité du verrouillage de compte.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'ResetLockoutCount').Line
    expected: null
    condition: ResetLockoutCount doit être supérieur ou égal à 15
  remediation:
    type: powershell
    script: net accounts /lockoutwindow:15
  threat:
    attack_technique: T1110.001
    attack_name: 'Brute Force: Password Guessing'
    cve: null
    cvss: null
    description: Maintient le compteur d'échecs pour préserver l'efficacité du verrouillage.
- control_id: '2.3.1.2'
  title: 'Ensure ''Accounts: Limit local account use of blank passwords to console logon only'' is set to ''Enabled'''
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Empêcher l'usage réseau des comptes locaux à mot de passe vide bloque une voie d'accès distant non authentifié.
  audit:
    command: (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa').LimitBlankPasswordUse
    expected: 1
    condition: LimitBlankPasswordUse doit valoir 1
  remediation:
    type: powershell
    script: Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name LimitBlankPasswordUse -Value 1
  threat:
    attack_technique: T1078.003
    attack_name: 'Valid Accounts: Local Accounts'
    cve: null
    cvss: null
    description: Empêche l'usage réseau de comptes locaux sans mot de passe.
- control_id: '2.2.1'
  title: Ensure 'Access this computer from the network' is configured
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Restreindre qui peut accéder à la machine depuis le réseau limite la surface d'attaque distante.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'SeNetworkLogonRight').Line
    expected: null
    condition: Le droit doit être limité à Administrators et Authenticated Users selon le rôle
  remediation:
    type: powershell
    script: '# Configurer User Rights Assignment : Access this computer from the network'
  threat:
    attack_technique: T1021
    attack_name: Remote Services
    cve: null
    cvss: null
    description: Limite les comptes pouvant se connecter à la machine via le réseau.
- control_id: '2.2.3'
  title: Ensure 'Allow log on locally' is set to 'Administrators'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Restreindre l'ouverture de session locale aux administrateurs réduit le risque d'accès physique non autorisé.
  audit:
    command: secedit /export /cfg "$env:TEMP\secpol.cfg" | Out-Null; (Select-String -Path "$env:TEMP\secpol.cfg" -Pattern 'SeInteractiveLogonRight').Line
    expected: null
    condition: Le droit d'ouverture de session locale doit être limité à Administrators
  remediation:
    type: powershell
    script: '# Configurer User Rights Assignment : Allow log on locally = Administrators'
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Limite l'ouverture de session console aux administrateurs.
- control_id: '2.3.17.5'
  title: 'Ensure ''User Account Control: Behavior of the elevation prompt for administrators'' is set to prompt for consent on the secure desktop'
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Demander le consentement sur le bureau sécurisé pour les élévations protège contre l'usurpation de l'invite UAC.
  audit:
    command: (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').ConsentPromptBehaviorAdmin
    expected: null
    condition: ConsentPromptBehaviorAdmin doit valoir 1 ou 2
  remediation:
    type: powershell
    script: Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name ConsentPromptBehaviorAdmin -Value 2
  threat:
    attack_technique: T1548.002
    attack_name: 'Abuse Elevation Control Mechanism: Bypass User Account Control'
    cve: null
    cvss: null
    description: Sécurise l'invite d'élévation contre l'usurpation par un processus malveillant.
- control_id: '2.3.17.7'
  title: 'Ensure ''User Account Control: Detect application installations and prompt for elevation'' is set to ''Enabled'''
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Détecter les installations et demander une élévation empêche l'installation silencieuse de logiciels par un processus non privilégié.
  audit:
    command: (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableInstallerDetection
    expected: 1
    condition: EnableInstallerDetection doit valoir 1
  remediation:
    type: powershell
    script: Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableInstallerDetection -Value 1
  threat:
    attack_technique: T1548.002
    attack_name: 'Abuse Elevation Control Mechanism: Bypass User Account Control'
    cve: null
    cvss: null
    description: Force une élévation explicite lors des installations logicielles.
- control_id: '2.3.7.2'
  title: 'Ensure ''Interactive logon: Do not require CTRL+ALT+DEL'' is set to ''Disabled'''
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 3
  impact: moderate
  description: Exiger CTRL+ALT+DEL avant connexion empêche les attaques par fausse fenêtre d'ouverture de session captant les identifiants.
  audit:
    command: (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').DisableCAD
    expected: 0
    condition: DisableCAD doit valoir 0
  remediation:
    type: powershell
    script: Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name DisableCAD -Value 0
  threat:
    attack_technique: T1056.002
    attack_name: 'Input Capture: GUI Input Capture'
    cve: null
    cvss: null
    description: Empêche la capture d'identifiants par fausse fenêtre de connexion.
- control_id: '2.3.7.1'
  title: 'Ensure ''Interactive logon: Do not display last user name'' is set to ''Enabled'''
  domain: access
  cis_level: L1
  profile: member
  automated: true
  weight: 2
  impact: moderate
  description: Ne pas afficher le dernier nom d'utilisateur connecté évite de divulguer un nom de compte valide à un attaquant ayant un accès physique.
  audit:
    command: (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').DontDisplayLastUserName
    expected: 1
    condition: DontDisplayLastUserName doit valoir 1
  remediation:
    type: powershell
    script: Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name DontDisplayLastUserName -Value 1
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Évite de divulguer un nom de compte valide lors de l'ouverture de session.
- control_id: '18.x.smbv1'
  title: Ensure SMBv1 protocol is disabled
  domain: network
  cis_level: L1
  profile: member
  automated: true
  weight: 5
  impact: critical
  description: SMBv1 est un protocole obsolète et gravement vulnérable qui doit être totalement désactivé. C'est le vecteur exploité par EternalBlue et le ver WannaCry.
  audit:
    command: (Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol).State
    expected: Disabled
    condition: La fonctionnalité SMB1Protocol doit être Disabled
  remediation:
    type: powershell
    script: Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
  threat:
    attack_technique: T1210
    attack_name: Exploitation of Remote Services
    cve: CVE-2017-0144
    cvss: null
    description: SMBv1 est le protocole exploité par EternalBlue (CVE-2017-0144), à l'origine du ver WannaCry, exécution de code à distance via paquets SMB falsifiés. Les sources divergent sur le score CVSS exact (entre 8.8 et 9.8), aussi seul le numéro de CVE est affirmé ici.
- control_id: '9.1.1'
  title: 'Ensure ''Windows Firewall: Domain: Firewall state'' is set to ''On'''
  domain: network
  cis_level: L1
  profile: member
  automated: true
  weight: 5
  impact: critical
  description: Le pare-feu Windows doit être actif sur le profil domaine pour filtrer le trafic réseau entrant et sortant.
  audit:
    command: (Get-NetFirewallProfile -Profile Domain).Enabled
    expected: 'True'
    condition: Le pare-feu du profil Domain doit être activé
  remediation:
    type: powershell
    script: Set-NetFirewallProfile -Profile Domain -Enabled True
  threat:
    attack_technique: T1190
    attack_name: Exploit Public-Facing Application
    cve: null
    cvss: null
    description: Un pare-feu actif filtre le trafic réseau et limite l'exposition des services.
- control_id: '9.3.1'
  title: 'Ensure ''Windows Firewall: Public: Firewall state'' is set to ''On'''
  domain: network
  cis_level: L1
  profile: member
  automated: true
