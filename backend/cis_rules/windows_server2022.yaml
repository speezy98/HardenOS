  domain: updates
  cis_level: L1
  profile: member
  automated: true
  weight: 5
  impact: critical
  description: Le service de spouleur d'impression a été le vecteur de PrintNightmare. Le désactiver (ou interdire l'impression distante) ferme cette voie d'exécution de code à distance.
  audit:
    command: (Get-Service -Name 'Spooler' -ErrorAction SilentlyContinue).StartType
    expected: Disabled
    condition: Le service Spooler doit être désactivé sur un serveur sans rôle d'impression, ou l'impression distante désactivée par stratégie
  remediation:
    type: powershell
    script: Set-Service -Name 'Spooler' -StartupType Disabled; Stop-Service -Name 'Spooler'
  threat:
    attack_technique: T1210
    attack_name: Exploitation of Remote Services
    cve: CVE-2021-34527
    cvss: 8.8
    description: Le spouleur d'impression a été exploité par PrintNightmare (CVE-2021-34527, CVSS 8.8), exécution de code à distance avec privilèges SYSTEM. Le désactiver ferme ce vecteur.
