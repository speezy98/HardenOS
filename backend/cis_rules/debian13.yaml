# CIS Debian Linux 13 — 100 contrôles sélectionnés pour HardenOS.
# Généré depuis SELECTION_CIS_Debian13.md. Ne pas éditer à la main.
benchmark:
  os_type: linux
  os_family: debian
  os_version: Debian 13
  source: CIS Debian Linux 13 Benchmark v1.0.0
  package_manager: apt
controls:
- control_id: '5.1.21'
  check_type: comparison
  title: Ensure sshd PermitRootLogin is disabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 5
  impact: critical
  description: Interdire la connexion SSH directe en root force l'usage de comptes nominatifs puis l'élévation de privilèges, garantissant la traçabilité et réduisant la valeur d'un mot de passe root compromis.
  audit:
    command: sshd -T | grep permitrootlogin
    expected: permitrootlogin no
    condition: Doit valoir no
  remediation:
    type: bash
    script: |-
      sed -i -E '/^[[:space:]]*#*[[:space:]]*PermitRootLogin[[:space:]]/Id' /etc/ssh/sshd_config
      echo 'PermitRootLogin no' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1021.004
    attack_name: 'Remote Services: SSH'
    cve: null
    cvss: null
    description: Empêche l'accès distant direct au compte le plus privilégié via SSH, limitant les mouvements latéraux et l'accès initial par identifiants root compromis.
- control_id: '5.1.20'
  check_type: comparison
  title: Ensure sshd PermitEmptyPasswords is disabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 5
  impact: critical
  description: Autoriser les mots de passe vides en SSH permettrait de se connecter à un compte sans aucun secret, une faille d'authentification majeure.
  audit:
    command: sshd -T | grep permitemptypasswords
    expected: permitemptypasswords no
    condition: Doit valoir no
  remediation:
    type: bash
    script: |-
      sed -i -E '/^[[:space:]]*#*[[:space:]]*PermitEmptyPasswords[[:space:]]/Id' /etc/ssh/sshd_config
      echo 'PermitEmptyPasswords no' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Bloque l'accès à des comptes dépourvus de mot de passe, vecteur d'accès non authentifié.
- control_id: '5.4.2.1'
  check_type: comparison
  title: Ensure root is the only UID 0 account
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 5
  impact: critical
  description: Seul le compte root doit avoir l'UID 0. Tout autre compte avec UID 0 disposerait silencieusement des pleins pouvoirs système.
  audit:
    command: 'awk -F: ''($3 == 0) { print $1 }'' /etc/passwd'
    expected: root
    condition: La sortie ne doit contenir que root
  remediation:
    type: bash
    script: '# Supprimer ou corriger tout compte non-root ayant l''UID 0'
  threat:
    attack_technique: T1078.003
    attack_name: 'Valid Accounts: Local Accounts'
    cve: null
    cvss: null
    description: Détecte les comptes portes dérobées à privilèges root, technique de persistance et d'élévation.
- control_id: '5.2.4'
  check_type: absence
  title: Ensure users must provide password for escalation
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Exiger un mot de passe pour sudo empêche une élévation silencieuse si un compte standard est compromis.
  audit:
    command: grep -rP -- '^\h*[^#].*NOPASSWD' /etc/sudoers /etc/sudoers.d/
    expected: null
    condition: Aucune entrée NOPASSWD ne doit être présente
  remediation:
    type: bash
    script: '# Retirer toutes les occurrences de NOPASSWD dans /etc/sudoers et /etc/sudoers.d/'
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: null
    cvss: null
    description: Empêche l'élévation de privilèges sans réauthentification, exploitée après compromission d'un compte.
- control_id: '5.2.1'
  check_type: presence
  title: Ensure sudo is installed
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: sudo permet une élévation de privilèges contrôlée et traçable, préférable à l'usage direct de root. Maintenir une version à jour évite des failles d'élévation connues.
  audit:
    command: dpkg-query -s sudo 2>/dev/null | grep -Pi 'install ok installed'
    expected: null
    condition: Le paquet sudo doit être installé
  remediation:
    type: bash
    script: apt install sudo
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: CVE-2021-3156
    cvss: 7.8
    description: Le contrôle de sudo et de sa version est lié à des failles d'élévation locale majeures comme Baron Samedit (CVE-2021-3156, CVSS 7.8), débordement de tampon permettant à tout utilisateur local de devenir root.
- control_id: '5.3.3.1.1'
  check_type: presence
  title: Ensure password failed attempts lockout is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Définir un seuil de tentatives échouées avant verrouillage protège contre les attaques par force brute sur les mots de passe.
  audit:
    command: grep -P '^\h*deny\h*=' /etc/security/faillock.conf
    expected: null
    condition: deny doit être inférieur ou égal à 5
  remediation:
    type: bash
    script: echo 'deny = 5' >> /etc/security/faillock.conf
  threat:
    attack_technique: T1110.001
    attack_name: 'Brute Force: Password Guessing'
    cve: null
    cvss: null
    description: Le verrouillage après échecs répétés neutralise les attaques par devinette de mot de passe.
- control_id: '5.3.2.2-faillock'
  check_type: presence
  title: Ensure pam_faillock module is enabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: pam_faillock verrouille un compte après plusieurs échecs d'authentification, contrant les attaques par force brute au niveau PAM.
  audit:
    command: grep -P 'pam_faillock\.so' /etc/pam.d/common-auth
    expected: null
    condition: Le module pam_faillock doit être activé dans la configuration PAM
  remediation:
    type: bash
    script: '# Configurer pam_faillock dans /etc/pam.d/common-auth et common-account'
  threat:
    attack_technique: T1110
    attack_name: Brute Force
    cve: null
    cvss: null
    description: Applique le verrouillage de compte au niveau du système d'authentification PAM contre la force brute.
- control_id: '5.3.3.2.2'
  check_type: presence
  title: Ensure password length is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Imposer une longueur minimale de 14 caractères augmente fortement la résistance aux attaques par devinette et par force brute hors ligne.
  audit:
    command: grep -P '^\h*minlen\h*=' /etc/security/pwquality.conf
    expected: null
    condition: minlen doit être supérieur ou égal à 14
  remediation:
    type: bash
    script: echo 'minlen = 14' >> /etc/security/pwquality.conf
  threat:
    attack_technique: T1110.002
    attack_name: 'Brute Force: Password Cracking'
    cve: null
    cvss: null
    description: Des mots de passe longs résistent au cassage hors ligne d'empreintes dérobées.
- control_id: '5.1.17'
  check_type: comparison
  title: Ensure sshd MaxAuthTries is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Limiter le nombre de tentatives d'authentification par connexion freine les attaques par force brute via SSH.
  audit:
    command: sshd -T | grep maxauthtries
    expected: maxauthtries 4
    condition: La valeur doit être inférieure ou égale à 4
  remediation:
    type: bash
    script: |-
      sed -i -E '/^[[:space:]]*#*[[:space:]]*MaxAuthTries[[:space:]]/Id' /etc/ssh/sshd_config
      echo 'MaxAuthTries 4' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1110.001
    attack_name: 'Brute Force: Password Guessing'
    cve: null
    cvss: null
    description: Réduit le nombre d'essais d'authentification par session SSH, limitant la force brute en ligne.
- control_id: '5.4.1.4'
  check_type: presence
  title: Ensure strong password hashing algorithm is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Configurer ENCRYPT_METHOD sur un algorithme fort (yescrypt ou sha512) assure que les nouveaux mots de passe sont stockés de façon robuste contre le cassage.
  audit:
    command: grep -Pi '^\h*ENCRYPT_METHOD\h+(SHA512|YESCRYPT)\b' /etc/login.defs
    expected: null
    condition: ENCRYPT_METHOD doit être YESCRYPT ou SHA512
  remediation:
    type: bash
    script: sed -i 's/^ENCRYPT_METHOD.*/ENCRYPT_METHOD YESCRYPT/' /etc/login.defs
  threat:
    attack_technique: T1003.008
    attack_name: 'OS Credential Dumping: /etc/passwd and /etc/shadow'
    cve: null
    cvss: null
    description: Un hachage fort des mots de passe rend inexploitable le vol du fichier shadow.
- control_id: '5.1.1'
  check_type: comparison
  title: Ensure permissions on /etc/ssh/sshd_config are configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Le fichier sshd_config contrôle la configuration du serveur SSH et doit être protégé en écriture, accessible uniquement à root.
  audit:
    command: stat -Lc '%a %u %g' /etc/ssh/sshd_config
    expected: 600 0 0
    condition: Permissions 600 ou plus restrictif, propriétaire et groupe root
  remediation:
    type: bash
    script: chmod u-x,go-rwx /etc/ssh/sshd_config; chown root:root /etc/ssh/sshd_config
  threat:
    attack_technique: T1098.004
    attack_name: 'Account Manipulation: SSH Authorized Keys'
    cve: null
    cvss: null
    description: Empêche la modification non autorisée de la configuration SSH pour y introduire une porte dérobée.
- control_id: '5.1.2'
  # presence-as-configured : vérifie que les clés existent et sont listées ;
  # la validation fine des permissions (600/root) relève d'une passe ultérieure.
  check_type: presence
  title: Ensure permissions on SSH private host key files are configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 4
  impact: high
  description: Les clés privées d'hôte SSH authentifient le serveur ; leur lecture par un tiers permettrait d'usurper l'identité du serveur.
  audit:
    command: find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec stat -Lc '%n %a %U %G' {} +
    expected: null
    condition: Chaque clé privée en 600 ou plus restrictif, propriétaire root
  remediation:
    type: bash
    script: find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec chmod 600 {} +; find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec chown root:root {} +
  threat:
    attack_technique: T1563.001
    attack_name: 'Remote Service Session Hijacking: SSH Hijacking'
    cve: null
    cvss: null
    description: Protège les clés d'hôte dont le vol permettrait des attaques de l'homme du milieu sur SSH.
- control_id: '5.1.22'
  check_type: comparison
  title: Ensure sshd PermitUserEnvironment is disabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Permettre aux utilisateurs de définir des variables d'environnement via SSH peut servir à contourner des restrictions ou détourner l'exécution.
  audit:
    command: sshd -T | grep permituserenvironment
    expected: permituserenvironment no
    condition: Doit valoir no
  remediation:
    type: bash
    script: |-
      sed -i -E '/^[[:space:]]*#*[[:space:]]*PermitUserEnvironment[[:space:]]/Id' /etc/ssh/sshd_config
      echo 'PermitUserEnvironment no' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1574.006
    attack_name: 'Hijack Execution Flow: Dynamic Linker Hijacking'
    cve: null
    cvss: null
    description: Empêche l'injection de variables d'environnement détournant l'exécution lors d'une session SSH.
- control_id: '5.1.10'
  check_type: comparison
  title: Ensure sshd HostbasedAuthentication is disabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: L'authentification basée sur l'hôte fait confiance à des machines entières plutôt qu'à des utilisateurs, ce qui est risqué en cas de compromission d'un hôte de confiance.
  audit:
    command: sshd -T | grep hostbasedauthentication
    expected: hostbasedauthentication no
    condition: Doit valoir no
  remediation:
    type: bash
    script: |-
      sed -i -E '/^[[:space:]]*#*[[:space:]]*HostbasedAuthentication[[:space:]]/Id' /etc/ssh/sshd_config
      echo 'HostbasedAuthentication no' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Empêche l'abus de relations de confiance entre hôtes pour un accès non authentifié.
- control_id: '5.1.11'
  check_type: comparison
  title: Ensure sshd IgnoreRhosts is enabled
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: IgnoreRhosts désactive les anciens fichiers .rhosts qui permettaient une authentification non sécurisée par confiance d'hôte.
  audit:
    command: sshd -T | grep ignorerhosts
    expected: ignorerhosts yes
    condition: Doit valoir yes
  remediation:
    type: bash
    script: |-
      sed -i -E '/^[[:space:]]*#*[[:space:]]*IgnoreRhosts[[:space:]]/Id' /etc/ssh/sshd_config
      echo 'IgnoreRhosts yes' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Neutralise un mécanisme d'authentification hérité contournant les contrôles d'identité.
- control_id: '5.2.7'
  check_type: presence
  title: Ensure access to the su command is restricted
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Restreindre la commande su à un groupe précis via pam_wheel limite quels comptes peuvent tenter de devenir root.
  audit:
    command: grep -Pi '^\h*auth\h+(required|requisite)\h+pam_wheel\.so' /etc/pam.d/su
    expected: null
    condition: pam_wheel.so avec use_uid et un groupe défini doit être configuré
  remediation:
    type: bash
    script: echo 'auth required pam_wheel.so use_uid group=sugroup' >> /etc/pam.d/su
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: null
    cvss: null
    description: Limite quels utilisateurs peuvent basculer vers root, réduisant les voies d'élévation.
- control_id: '5.3.3.2.2-dict'
  check_type: comparison
  title: Ensure password dictionary check is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Vérifier les mots de passe contre un dictionnaire empêche le choix de mots de passe courants triviaux à deviner.
  audit:
    # Émet une valeur canonique comparable : 'dictcheck=1' si (et seulement si)
    # la valeur exacte 1 est configurée (borne \b -> pas de faux positif sur 10),
    # sinon 'dictcheck non conforme'. Le comparateur "contient" est ainsi fiable.
    command: grep -qP '^\h*dictcheck\h*=\h*1\b' /etc/security/pwquality.conf 2>/dev/null && echo 'dictcheck=1' || echo 'dictcheck non conforme'
    expected: dictcheck=1
    condition: dictcheck doit valoir 1
  remediation:
    type: bash
    script: echo 'dictcheck = 1' >> /etc/security/pwquality.conf
  threat:
    attack_technique: T1110.001
    attack_name: 'Brute Force: Password Guessing'
    cve: null
    cvss: null
    description: Bloque les mots de passe figurant dans les dictionnaires d'attaque courants.
- control_id: '5.4.1.1'
  check_type: presence
  title: Ensure password expiration is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Forcer l'expiration périodique des mots de passe limite la durée pendant laquelle un secret compromis reste exploitable.
  audit:
    command: grep -P '^\h*PASS_MAX_DAYS' /etc/login.defs
    expected: null
    condition: PASS_MAX_DAYS doit être inférieur ou égal à 365
  remediation:
    type: bash
    script: sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS 365/' /etc/login.defs
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Réduit la fenêtre d'usage d'identifiants valides dérobés.
- control_id: '5.1.7'
  # presence-as-configured : vérifie que les directives sont définies ; la
  # validation de la plage (interval 1-15, countmax <= 3) relève d'une passe ultérieure.
  check_type: presence
  title: Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Ces paramètres ferment automatiquement les sessions SSH inactives, réduisant le risque qu'une session abandonnée soit détournée.
  audit:
    command: sshd -T | grep -E 'clientaliveinterval|clientalivecountmax'
    expected: null
    condition: ClientAliveInterval entre 1 et 15, ClientAliveCountMax inférieur ou égal à 3
  remediation:
    type: bash
    script: |-
      sed -i -E '/^[[:space:]]*#*[[:space:]]*ClientAlive(Interval|CountMax)[[:space:]]/Id' /etc/ssh/sshd_config
      printf 'ClientAliveInterval 15\nClientAliveCountMax 3\n' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1563.001
    attack_name: 'Remote Service Session Hijacking: SSH Hijacking'
    cve: null
    cvss: null
    description: Limite l'exposition des sessions SSH inactives au détournement.
- control_id: '5.2.2'
  check_type: presence
  title: Ensure sudo commands use pty
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Forcer l'usage d'un pseudo-terminal pour sudo empêche certaines attaques par détournement de processus exécutés via sudo.
  audit:
    command: grep -rPi -- '^\h*Defaults\h+([^#\n\r]+,)?use_pty\b' /etc/sudoers /etc/sudoers.d/
    expected: null
    condition: La directive Defaults use_pty doit être présente
  remediation:
    type: bash
    script: echo 'Defaults use_pty' >> /etc/sudoers.d/use_pty
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: null
    cvss: null
    description: Empêche le détournement de processus enfant lors d'une exécution sudo.
- control_id: '5.2.3'
  check_type: presence
  title: Ensure sudo log file exists
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Journaliser les commandes sudo dans un fichier dédié assure la traçabilité des élévations de privilèges pour l'investigation.
  audit:
    command: grep -rPsi -- '^\h*Defaults\h+([^#]+,\h*)?logfile\h*=' /etc/sudoers /etc/sudoers.d/
    expected: null
    condition: Une directive Defaults logfile doit être définie
  remediation:
    type: bash
    script: echo 'Defaults logfile="/var/log/sudo.log"' >> /etc/sudoers.d/logfile
  threat:
    attack_technique: T1548.003
    attack_name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
    cve: null
    cvss: null
    description: Trace les élévations de privilèges pour détecter les abus de sudo.
- control_id: '1.4.1'
  check_type: presence
  title: Ensure bootloader password is set
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Protéger le chargeur de démarrage GRUB par mot de passe empêche la modification des paramètres de boot par un accès physique (mode single user).
  audit:
    command: grep -P '^\h*(set superusers|password)' /boot/grub/grub.cfg
    expected: null
    condition: Un superuser et un mot de passe GRUB doivent être définis
  remediation:
    type: bash
    script: '# Définir un superuser et un mot de passe via grub-mkpasswd-pbkdf2 puis update-grub'
  threat:
    attack_technique: T1542
    attack_name: Pre-OS Boot
    cve: null
    cvss: null
    description: Empêche le contournement de l'authentification via modification des paramètres de démarrage.
- control_id: '1.4.2'
  check_type: comparison
  title: Ensure access to bootloader config is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Protéger le fichier de configuration GRUB en lecture/écriture empêche la fuite ou l'altération des paramètres de boot et du hash du mot de passe GRUB.
  audit:
    command: stat -Lc '%a %u %g' /boot/grub/grub.cfg
    expected: 600 0 0
    condition: Permissions 600 ou plus restrictif, propriétaire root
  remediation:
    type: bash
    script: chown root:root /boot/grub/grub.cfg; chmod u-wx,go-rwx /boot/grub/grub.cfg
  threat:
    attack_technique: T1542
    attack_name: Pre-OS Boot
    cve: null
    cvss: null
    description: Protège la configuration de démarrage contre la lecture et l'altération.
- control_id: '5.4.3.2'
  check_type: presence
  title: Ensure default user shell timeout is configured
  domain: access
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Définir un délai d'inactivité du shell déconnecte les sessions oubliées, réduisant le risque d'exploitation d'une session laissée ouverte.
  audit:
    command: grep -rPs '^\h*(readonly\h+)?(export\h+)?TMOUT\b' /etc/profile /etc/profile.d/*.sh /etc/bash.bashrc
    expected: null
    condition: TMOUT doit être inférieur ou égal à 900 secondes
  remediation:
    type: bash
    script: echo 'readonly TMOUT=900 ; export TMOUT' >> /etc/profile.d/tmout.sh
  threat:
    attack_technique: T1078
    attack_name: Valid Accounts
    cve: null
    cvss: null
    description: Ferme les sessions inactives, limitant le détournement d'une session authentifiée abandonnee.
- control_id: '4.1.2'
  check_type: presence
  title: Ensure ufw service is enabled and active
  domain: network
  cis_level: L1
  profile: server
  automated: true
  weight: 5
  impact: critical
  description: Le pare-feu doit être actif et activé au démarrage pour filtrer le trafic réseau en continu, première ligne de défense de l'hôte.
  audit:
    command: 'systemctl is-enabled ufw.service; ufw status | grep -i ''Status: active'''
    expected: null
    condition: ufw doit être enabled et son statut actif
  remediation:
    type: bash
    script: |-
      apt install ufw
