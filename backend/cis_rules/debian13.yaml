- control_id: '5.1.9'
  check_type: comparison
  title: Ensure sshd GSSAPIAuthentication is disabled
  domain: crypto
  cis_level: L1
  profile: server
  automated: true
  weight: 3
  impact: moderate
  description: Désactiver GSSAPI quand il n'est pas utilisé réduit la surface d'attaque cryptographique du service SSH.
  audit:
    command: sshd -T | grep gssapiauthentication
    expected: gssapiauthentication no
    condition: Doit valoir no sauf usage de Kerberos
  remediation:
    type: bash
    script: |-
      sed -i -E '/^[[:space:]]*#*[[:space:]]*GSSAPIAuthentication[[:space:]]/Id' /etc/ssh/sshd_config
      echo 'GSSAPIAuthentication no' >> /etc/ssh/sshd_config
  threat:
    attack_technique: T1190
    attack_name: Exploit Public-Facing Application
    cve: null
    cvss: null
    description: Réduit la surface d'attaque du service SSH en désactivant un mécanisme inutilisé.
